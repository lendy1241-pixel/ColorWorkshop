name: Build IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.2'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Install Pillow & Generate Icons
        run: |
          pip3 install Pillow
          python3 Scripts/generate_icons.py

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project ColorWorkshop.xcodeproj \
            -scheme ColorWorkshop \
            -configuration Release \
            -archivePath build/ColorWorkshop.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            -destination 'generic/platform=iOS'

      - name: Export IPA
        run: |
          mkdir -p build/Payload
          cp -R build/ColorWorkshop.xcarchive/Products/Applications/ColorWorkshop.app build/Payload/
          cd build
          zip -r 调色工坊.ipa Payload
          cd ..

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 调色工坊.ipa
          path: build/调色工坊.ipa
