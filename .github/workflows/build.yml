name: Build IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.2'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project ColorWorkshop.xcodeproj \
            -scheme ColorWorkshop \
            -configuration Release \
            -archivePath build/ColorWorkshop.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            -destination 'generic/platform=iOS'

      - name: Install Pillow
        run: pip3 install --break-system-packages Pillow 2>/dev/null || true

      - name: Export IPA & Inject Icons
        run: |
          APP="build/ColorWorkshop.xcarchive/Products/Applications/ColorWorkshop.app"
          mkdir -p build/Payload

          # Run icon fix script (flatten alpha -> copy to bundle)
          python3 Scripts/inject_icons.py "${APP}"

          # Ensure CFBundleIconFiles in compiled plist
          /usr/libexec/PlistBuddy -c "Add :CFBundleIconFiles array" "${APP}/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleIconFiles:0 string AppIcon60x60@2x" "${APP}/Info.plist" 2>/dev/null || true

          cp -R "${APP}" build/Payload/
          cd build && zip -r 调色工坊.ipa Payload && cd ..

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 调色工坊.ipa
          path: build/调色工坊.ipa
